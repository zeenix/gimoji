[package]
name = "gimoji-core"
description = "Core picker UI and emoji database shared by gimoji's native and web frontends"
version = "1.4.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["emoji", "git", "gitmoji", "tui", "picker"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = { version = "0.30.1", default-features = false }

[build-dependencies]
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.116"
databake = { version = "0.2.1", features = ["derive"] }
